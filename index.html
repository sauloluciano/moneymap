function saveNewCat() {
  const label = document.getElementById("newCatLabel").value.trim();
  if (!label) { alert("Digite um nome para a categoria."); return; }
  const color = document.getElementById("newCatColor").value;
  const icon  = document.getElementById("newCatIcon").value;
  const id    = label.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"_").slice(0,20) + "_" + Date.now().toString(36);
  CATEGORIES.splice(CATEGORIES.length - 3, 0, { id, label, icon, color });
  // Add to EXPENSE_CATS before "outros"
  const outIdx = EXPENSE_CATS.indexOf("outros");
  if (outIdx >= 0) EXPENSE_CATS.splice(outIdx, 0, id);
  else EXPENSE_CATS.push(id);
  // Add empty keyword slot
  if (!DEFAULT_KEYWORD_MAP[id]) DEFAULT_KEYWORD_MAP[id] = [];
  KEYWORD_MAP = loadKeywordMap();
  // Persist custom categories
  saveCustomCategories();
  renderConfig();
  alert("Categoria \"" + label + "\" criada! Adicione palavras-chave na aba Palavras-chave.");
}

function saveEditCat(id) {
  const label = document.getElementById("editCatLabel").value.trim();
  if (!label) return;
  const c = CATEGORIES.find(x => x.id === id);
  if (c) c.label = label;
  saveCustomCategories();
  renderConfig();
}

function saveCustomCategories() {
  const custom = CATEGORIES.filter(c => !["supermercado","transporte","saude","lazer","viagem","moradia","educacao","custo_fin_focus","custo_fin_pessoal","despesas_focus","pessoais_saulo","aporte_empresa","retorno_aporte","receita","outros"].includes(c.id));
  localStorage.setItem("fp:customCats", JSON.stringify(custom));
  // Also persist label overrides for built-in cats
  const overrides = {};
  CATEGORIES.forEach(c => { overrides[c.id] = c.label; });
  localStorage.setItem("fp:catLabels", JSON.stringify(overrides));
}

function loadCustomCategories() {
  // Load label overrides
  const overrides = JSON.parse(localStorage.getItem("fp:catLabels") || "{}");
  CATEGORIES.forEach(c => { if (overrides[c.id]) c.label = overrides[c.id]; });
  // Load custom cats
  const custom = JSON.parse(localStorage.getItem("fp:customCats") || "[]");
  custom.forEach(c => {
    if (!CATEGORIES.find(x => x.id === c.id)) {
      // Insert before "aporte_empresa" (3 system cats from end)
      CATEGORIES.splice(CATEGORIES.length - 4, 0, c);
      const outIdx = EXPENSE_CATS.indexOf("outros");
      if (outIdx >= 0) EXPENSE_CATS.splice(outIdx, 0, c.id);
      else EXPENSE_CATS.push(c.id);
      if (!DEFAULT_KEYWORD_MAP[c.id]) DEFAULT_KEYWORD_MAP[c.id] = [];
    }
  });
  KEYWORD_MAP = loadKeywordMap();
}

function saveKeywords() {
  const expCats = [...CATEGORIES].filter(c => !["receita","aporte_empresa","retorno_aporte"].includes(c.id)).sort((a,b)=>a.label.localeCompare(b.label,'pt-BR'));
  const custom = {};
  expCats.forEach(c => {
    const raw = (document.getElementById("kw_" + c.id)?.value || "").trim();
    if (raw) custom[c.id] = raw.split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
  });
  localStorage.setItem("fp:keywords", JSON.stringify(custom));
  KEYWORD_MAP = loadKeywordMap();
  alert("Palavras-chave salvas! Serão aplicadas na próxima importação.");
}

function renderProjetos() {
  const active   = projects.filter(p => !p.archived);
  const archived = projects.filter(p =>  p.archived);

  let html = '<div class="card mb-20">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">'
    + '<div><div style="font-size:15px;font-weight:500">Projetos</div>'
    + '<div style="font-size:12px;color:var(--text2);margin-top:2px">Categorias temporárias para rastrear gastos de eventos ou reformas</div></div>'
    + '<button class="btn-primary" onclick="openNewProject()" style="font-size:12px;padding:6px 14px">+ Novo projeto</button>'
    + '</div>'
    + '<div id="newProjectForm" style="display:none;background:var(--surface2);border-radius:10px;padding:14px;margin-bottom:16px">'
    + '<div style="font-size:13px;font-weight:500;margin-bottom:10px">Novo projeto</div>'
    + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    + '<input type="text" id="newProjectName" placeholder="Ex: Nascimento da Serena" style="flex:1;min-width:180px;font-size:13px;padding:6px 10px;border-radius:7px;border:0.5px solid var(--border2);background:var(--surface);color:var(--text)">'
    + '<input type="color" id="newProjectColor" value="#9B59B6" style="width:36px;height:32px;border-radius:6px;border:0.5px solid var(--border2);cursor:pointer;padding:2px">'
    + '<button class="btn-primary" onclick="saveNewProject()" style="font-size:12px">Criar</button>'
    + '<button class="btn" onclick="document.getElementById(\'newProjectForm\').style.display=\'none\'" style="font-size:12px">Cancelar</button>'
    + '</div></div>';

  if (active.length === 0 && archived.length === 0) {
    html += '<div style="font-size:13px;color:var(--text2);padding:16px 0;text-align:center">Nenhum projeto criado ainda. Crie um para rastrear gastos por evento ou reforma.</div>';
  }

  active.forEach(function(p) {
    const txs = transactions.filter(function(t) { return t.projectId === p.id; });
    const total = Math.abs(txs.reduce(function(s,t) { return s + t.amount; }, 0));
    const months = [...new Set(txs.map(function(t) { return t.date.slice(0,7); }))].sort();
    html += buildProjectCard(p, txs, total, months, false);
  });

  if (archived.length > 0) {
    html += '<div style="font-size:12px;font-weight:500;color:var(--text2);margin-top:20px;margin-bottom:10px">Projetos arquivados</div>';
    archived.forEach(function(p) {
      const txs = transactions.filter(function(t) { return t.projectId === p.id; });
      const total = Math.abs(txs.reduce(function(s,t) { return s + t.amount; }, 0));
      const months = [...new Set(txs.map(function(t) { return t.date.slice(0,7); }))].sort();
      html += buildProjectCard(p, txs, total, months, true);
    });
  }

  html += '</div>';
  document.getElementById("projetos").innerHTML = html;
}

function buildProjectCard(p, txs, total, months, isArchived) {
  const monthLabel = months.length > 0
    ? months.map(function(m) { const pts=m.split("-"); return new Date(+pts[0],+pts[1]-1,1).toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}); }).join(", ")
    : "Sem transações";
  const opacity = isArchived ? "opacity:0.6;" : "";
  return '<div style="' + opacity + 'border:0.5px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">'
    + '<div style="display:flex;align-items:center;gap:10px">'
    + '<span style="width:12px;height:12px;border-radius:50%;background:' + p.color + ';flex-shrink:0"></span>'
    + '<div>'
    + '<div style="font-size:14px;font-weight:500">' + p.name + (isArchived ? ' <span style="font-size:10px;background:var(--surface2);color:var(--text2);border-radius:4px;padding:1px 5px">arquivado</span>' : '') + '</div>'
    + '<div style="font-size:12px;color:var(--text2);margin-top:2px">' + txs.length + ' transações · ' + monthLabel + '</div>'
    + '</div></div>'
    + '<div style="display:flex;align-items:center;gap:12px">'
    + '<span style="font-size:16px;font-weight:600;color:' + p.color + '">' + fmt(total) + '</span>'
    + (!isArchived
      ? '<button onclick="archiveProject(\'' + p.id + '\')" class="btn-sm" style="font-size:11px" title="Arquivar">📦 Arquivar</button>'
      : '<button onclick="unarchiveProject(\'' + p.id + '\')" class="btn-sm" style="font-size:11px">Reativar</button>')
    + '</div></div>'
    + (txs.length > 0 ? buildProjectTxList(txs, p) : '')
    + '</div>';
}

function buildProjectTxList(txs, p) {
  const recent = [...txs].sort(function(a,b) { return b.date.localeCompare(a.date); }).slice(0,5);
  let rows = recent.map(function(t) {
    return '<tr>'
      + '<td style="font-size:11px;color:var(--text2);padding:4px 8px;white-space:nowrap">' + fmtDate(t.date) + '</td>'
      + '<td style="font-size:12px;padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">' + t.description + '</td>'
      + '<td style="font-size:12px;font-weight:500;text-align:right;padding:4px 8px;color:' + (t.amount>0?"#27AE60":"#E24B4A") + '">' + (t.amount>0?"+":"") + fmt(t.amount) + '</td>'
      + '</tr>';
  }).join("");
  return '<div style="margin-top:10px;background:var(--surface2);border-radius:7px;overflow:hidden">'
    + '<table style="width:100%;border-collapse:collapse"><tbody>' + rows + '</tbody></table>'
    + (txs.length > 5 ? '<div style="font-size:11px;color:var(--text2);padding:5px 8px;text-align:center">+ ' + (txs.length-5) + ' mais transações</div>' : '')
    + '</div>';
}

  const name = (document.getElementById("newProjectName")?.value || "").trim();

  const color = document.getElementById("newProjectColor")?.value || "#9B59B6";

  if (p) { p.archived = true; save(); renderProjetos(); }
}

function unarchiveProject(id) {
  const p = projects.find(function(x) { return x.id === id; });
  if (p) { p.archived = false; save(); renderProjetos(); }
}

// Migrate old categories on first load (runs after init() populates transactions)
function migrateCats() {
  let changed = false;
  transactions = transactions.map(t => {
    if (t.category === 'roupas')   { t.category = 'pessoais_saulo'; changed = true; }
    if (t.category === 'servicos') { t.category = 'outros';         changed = true; }
    if (t.category === 'cartao_dani' && !t.isAdditionalCard) {
      t.isAdditionalCard = true; changed = true;
    }
    return t;
  });
  if (changed) saveTxToSupabase(transactions).catch(e => console.error('migrateCats save error:', e));
  // Clear stale catLabel overrides for built-in categories
  // (prevents old saved labels from overriding renamed built-ins)
  const catLabelsStored = localStorage.getItem('fp:catLabels');
  if (catLabelsStored) {
    try {
      const labelsObj = JSON.parse(catLabelsStored);
      const staleLabels = ['Aporte Empresa','Retorno de Aporte','Retorno Aporte',
        'Pessoais - Saulo','Educação','Transporte','Roupas','Serviços'];
      let labelChanged = false;
      staleLabels.forEach(function(oldLabel) {
        Object.keys(labelsObj).forEach(function(id) {
          if (labelsObj[id] === oldLabel) { delete labelsObj[id]; labelChanged = true; }
        });
      });
      if (labelChanged) localStorage.setItem('fp:catLabels', JSON.stringify(labelsObj));
    } catch(e) {}
  }

  // Remove duplicate custom categories that duplicate built-in ones
  const customStored = localStorage.getItem('fp:customCats');
  if (customStored) {
    try {
      const builtInIds = ["supermercado","transporte","saude","lazer","viagem","moradia",
        "educacao","custo_fin_focus","custo_fin_pessoal","despesas_focus","pessoais_saulo",
        "transferencia","cachorros","cartao_dani","serena_rotina","inv_temp_cred","inv_temp_deb",
        "inv_aporte","inv_resgate","inv_lucro","outras_entradas","aporte_empresa","retorno_aporte","receita","outros"];
      let customs = JSON.parse(customStored);
      const builtInLabels = CATEGORIES.map(c => c.label.toLowerCase());
      const cleaned = customs.filter(c =>
        !builtInIds.includes(c.id) &&
        !builtInLabels.includes((c.label||'').toLowerCase())
      );
      if (cleaned.length !== customs.length) {
        localStorage.setItem('fp:customCats', JSON.stringify(cleaned));
      }
    } catch(e) {}
  }
}

// Load data from Supabase, then initialize
(async function init() {
  // Check existing session first
  const hasSession = await checkSession();
  // Load all data
  document.getElementById("dashboard").innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text2)"><i class="ti ti-loader-2" style="font-size:40px;display:block;margin-bottom:12px;animation:spin 1s linear infinite"></i>Carregando dados...</div>';
  try {
    const remoteTx = await loadTxFromSupabase();
    if (remoteTx && remoteTx.length > 0) transactions = remoteTx;
    const remoteGoals    = await DB.get("fp:goals");    if (remoteGoals)    goals    = JSON.parse(remoteGoals);
    const remoteInv      = await DB.get("fp:inv");      if (remoteInv)      invGoal  = JSON.parse(remoteInv);
    const remoteProjects = await DB.get("fp:projects"); if (remoteProjects) projects = JSON.parse(remoteProjects);
    const remoteSources  = await DB.get("fp:sources");  if (remoteSources)  sources  = JSON.parse(remoteSources);
    const remoteImportLog= await DB.get("fp:importLog"); if (remoteImportLog) localStorage.setItem("fp:importLog", remoteImportLog);
  } catch(e) { console.warn("Supabase load error:", e); }
  migrateCats();
  loadCustomCategories();
  buildMonthSelect();
  renderDashboard();
  updateUnclassifiedBadge();
  // Daily backup (only if logged in)
  if (hasSession) runDailyBackup();
})();

    <div style="background:var(--surface);border-radius:14px;padding:28px;width:100%;max-width:480px;box-shadow:0 8px 32px rgba(0,0,0,0.18);border:0.5px solid var(--border)">
      <div style="font-size:15px;font-weight:600;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center">

        <button onclick="closeNewTxModal()" style="background:transparent;border:none;cursor:pointer;font-size:18px;color:var(--text2)">✕</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Data</div>
          <input type="date" id="ntx_date" value="${today}" style="width:100%;font-size:13px;padding:7px 10px;border-radius:7px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text)">
        </div>
        <div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Tipo</div>
          <select id="ntx_sign" style="width:100%;font-size:13px;padding:7px 8px;border-radius:7px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text)">
            <option value="neg">− Débito</option>
            <option value="pos">+ Crédito</option>
          </select>
        </div>
        <div style="grid-column:span 2">
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Descrição *</div>
          <input type="text" id="ntx_desc" placeholder="Descrição da transação" style="width:100%;font-size:13px;padding:7px 10px;border-radius:7px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text)">
        </div>
        <div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Valor *</div>
          <input type="number" id="ntx_amount" step="0.01" min="0" placeholder="0,00" style="width:100%;font-size:13px;padding:7px 10px;border-radius:7px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text)">
        </div>
        <div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Categoria</div>
          <select id="ntx_cat" class="cat-select" style="width:100%;font-size:13px;padding:7px 8px"><option value="">— não classif. —</option>${catOpts}</select>
        </div>
        <div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Observação</div>
          <input type="text" id="ntx_notes" maxlength="50" placeholder="Opcional" style="width:100%;font-size:13px;padding:7px 10px;border-radius:7px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text)">
        </div>
        <div>
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Projeto</div>
          <select id="ntx_proj" class="cat-select" style="width:100%;font-size:13px;padding:7px 8px"><option value="">Sem projeto</option>${projOpts}</select>

        </div>
        <div style="grid-column:span 2">

function closeNewTxModal() {
  const m = document.getElementById("newTxModal");
  if (m) m.remove();
}

function saveNewTx() {
  const date   = document.getElementById("ntx_date")?.value;
  const desc   = (document.getElementById("ntx_desc")?.value || "").trim();
  const amtRaw = parseFloat(document.getElementById("ntx_amount")?.value);
  const sign   = document.getElementById("ntx_sign")?.value;
  const cat    = document.getElementById("ntx_cat")?.value;
  const notes  = (document.getElementById("ntx_notes")?.value || "").trim();
  const proj   = document.getElementById("ntx_proj")?.value;
  const dani   = document.getElementById("ntx_dani")?.checked;
  const err    = document.getElementById("ntx_err");

  if (!date) { err.textContent = "Informe a data."; return; }
  if (!desc) { err.textContent = "Informe a descrição."; return; }
  if (isNaN(amtRaw) || amtRaw <= 0) { err.textContent = "Informe um valor maior que zero."; return; }

  const userName = currentUser ? currentUser.charAt(0).toUpperCase() + currentUser.slice(1) : "Usuário";
  const amount = sign === "pos" ? amtRaw : -amtRaw;
  const tx = {
    id:               Math.random().toString(36).slice(2) + Date.now().toString(36),
    date,
    originalDate:     null,
    description:      desc.toUpperCase(),
    amount,
    type:             amount >= 0 ? "income" : "expense",
    category:         cat || null,
    notes:            notes || "",
    sourceId:         null,
    sourceName:       "Manual - " + userName,
    projectId:        proj || undefined,
    importId:         null,
    isAdditionalCard: dani || false,
    _rawDate:         null,
  };
  transactions.push(tx);
  save();
  closeNewTxModal();
  renderActiveTab();
  updateUnclassifiedBadge();
}
</script>
